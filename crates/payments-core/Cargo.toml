[package]
name = "moros-payments-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
ark-bn254 = "0.6.0"
ark-ff = "0.6.0"
base64 = "0.22.1"
bip39 = { version = "2.2.0", default-features = false, features = ["std"] }
ed25519-dalek = "2.2.0"
hkdf = "0.12.4"
sha2 = "0.10.9"
taceo-poseidon2 = { version = "0.3.0", default-features = false, features = ["bn254", "t4"] }
thiserror = "1.0.69"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[dev-dependencies]
hex = "0.4.3"
