[package]
name = "payment-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
payment-types = { path = "../payment-types" }
privacy-types = { path = "../privacy-types" }
soroban-sdk = { workspace = true }

[dev-dependencies]
ed25519-dalek = "2.2.0"
soroban-sdk = { workspace = true, features = ["testutils"] }
